        {
          "claimId": "claim_strep_causal",
          "effect": 0.35
        }
      ],
      "visibleToAgentIds": []
    },
    {
      "id": "ev_swedo_criteria",
      "text": "The case meets Swedo et al. (1998) proposed PANDAS criteria: prepubertal onset, OCD/tic disorder, acute onset, temporal association with strep, neurological abnormalities during exacerbation. However, these criteria remain controversial and are not in DSM-5.",
      "effects": [
        {
          "claimId": "claim_pandas_dx",
          "effect": 0.3
        },
        {
          "claimId": "claim_strep_causal",
          "effect": 0.2
        }
      ],
      "visibleToAgentIds": []
    },
    {
      "id": "ev_lancet_systematic_review",
      "text": "A 2019 Lancet Psychiatry systematic review of 31 studies found insufficient evidence that streptococcal infection causes neuropsychiatric symptoms. Temporal correlations were inconsistent across prospective studies, and IVIG trials showed no benefit over placebo in two RCTs (Williams et al., 2019).",
      "effects": [
        {
          "claimId": "claim_pandas_dx",
          "effect": -0.5
        },
        {
          "claimId": "claim_strep_causal",
          "effect": -0.7
        },
        {
          "claimId": "claim_tourette",
          "effect": 0.3
        }
      ],
      "visibleToAgentIds": []
    },
    {
      "id": "ev_base_rate",
      "text": "Strep pharyngitis affects 15-35% of children annually. Tic disorders emerge in 10-20% of school-age children. Given these high base rates, temporal co-occurrence is expected by chance alone in ~3-7% of the pediatric population, without requiring a causal mechanism.",
      "effects": [
        {
          "claimId": "claim_strep_causal",
          "effect": -0.6
        },
        {
          "claimId": "claim_tourette",
          "effect": 0.25
