  "claims": [
    {
      "id": "claim_pandas_dx",
      "text": "The patient's acute-onset OCD and motor tics following group A streptococcal pharyngitis are best explained by PANDAS (Pediatric Autoimmune Neuropsychiatric Disorders Associated with Streptococcal infections), requiring antibiotic prophylaxis and IVIG.",
      "truthLabel": "mixed"
    },
    {
      "id": "claim_tourette",
      "text": "The presentation is better explained by Tourette syndrome with comorbid OCD, which commonly emerges at this age (7-10 years) and does not require immunotherapy.",
      "truthLabel": "true"
    },
    {
      "id": "claim_autoimmune_encephalitis",
      "text": "Anti-NMDA receptor autoimmune encephalitis should be ruled out, as it can present with acute psychiatric symptoms and movement abnormalities in children.",
      "truthLabel": "true"
    },
    {
      "id": "claim_strep_causal",
      "text": "The temporal correlation between strep infection and symptom onset proves a causal autoimmune mechanism rather than coincidental timing.",
      "truthLabel": "false"
    }
  ],
  "evidence": [
    {
      "id": "ev_clinical_presentation",
      "text": "8-year-old male presents with sudden onset of severe OCD (contamination fears, hand-washing), motor tics, emotional lability, and separation anxiety 2 weeks after confirmed group A strep pharyngitis. ASO titer elevated at 480 IU/mL. Neurological exam otherwise normal.",
