      "citation": "SciTaT item 1808.02092v2-q2",
      "summary": "Now assume the case of~$\\widetilde{D}_{n}$ has already been dealt with for $n \\geq 4$. To prove the amenability of~$\\widetilde{D}_{n+1}$, choose $\\T$ to be the unique tube of maximal rank. Similarly to the base case, $S^{\\perp}$ is of amenable type for $S \\in \\T$, since the tubular type $\\left(2,2,(n+1)-2 - 1\\right)$ belongs to~$\\widetilde{D}_{n}$.\nBy inspection of Table~\\ref{tab:TubularTypes}, we see that the indecomposable preprojectives have negative defect~one or~two. Hence, they are in a hyperfinite family by Lemma~\\ref{lemma:PPofDefectSmallerThanTubeRank}. The regular indecomposables are hyperfinite by an argument similar to that of the base case. To deal with the indecomposable preinjectives, we may apply the same induction as in the base case.",
