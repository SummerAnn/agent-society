      "text": "In order to assess the accuracy of different approximations to the ACFD formula, we\nhave chosen to use the S22 database of intermolecular interactions~\\cite{S22}, a widely used \nbenchmark database with binding energies calculated by a number of\ndifferent groups using high-level quantum chemical methods~\\cite{S22,Sherrill-S22}.\nIn particular, we use the recent basis-set extrapolated CCSD(T) binding energies\ncalculated by Takatani \\textit{et al.}~\\cite{Sherrill-S22}.\nThese binding energies are presumed to have an accuracy of $\\approx$\n0.1 kcal/mol (1\\% relative error). This level of accuracy allows an\nunbiased assessment of approximate approaches for treating dispersion interactions.\nTable~\\ref{tabS22} summarizes the results of our calculations on the S22\ndatabase. We used two different non-empirical DFT functionals: PBE~\\cite{PBE} and PBE0~\\cite{PBE0-1,PBE0-2}. \nFor every functional, we have carried out two tests: (i) using the second-order\nexpansion of Eq.~(\\ref{eqRPAscr}), and (ii) using the full (infinite) series\nin Eq.~(\\ref{eqRPAscr}).\nThe $\\beta$ parameter has been adjusted for every combination of functional\nand method. We note that the approach presented here does not require the definition of\nvan der Waals radii---all the necessary information is contained in the\ninput frequency-dependent polarizabilities and the adjusted $\\beta$ parameter.",
