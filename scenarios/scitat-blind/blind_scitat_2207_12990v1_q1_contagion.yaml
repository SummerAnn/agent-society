      "citation": "SciTaT item 2207.12990v1-q1",
      "summary": "Statistics of several time signals (mean $\\langle\\bullet\\rangle$ and root-mean-square of the fluctuation component $\\sigma_{\\bullet}=\\sqrt{\\langle\\left(\\bullet-\\langle\\bullet\\rangle\\right)^2\\rangle}$, this latter corrected for domain size) of the statistically-steady turbulent state as computed in the full orthogonal domain and in the azimuthally-long but axially-narrow parallelogram domain. The uncertainty margins correspond to 95\\% confidence intervals obtained through stationary bootstrapping.\ncase | full domain | full domain | long narrow domain | long narrow domain\n$(n_1,k_1,n_2,k_2)$ | $(1,0,0,0.2)$ | $(1,0,0,0.2)$ | $(1,0.2,0,4.5)$ | $(1,0.2,0,4.5)$\n$(L,N,M)$ | $(322,322,42)$ | $(322,322,42)$ | $(18,322,42)$ | $(18,322,42)$\nestimator | $\\langle\\bullet\\rangle$ | $\\sigma_{\\bullet}=\\sqrt{\\langle\\left(\\bullet-\\langle\\bullet\\rangle\\right)^2\\rangle}$ | $\\langle\\bullet\\rangle$ | $\\sigma_{\\bullet}=\\sqrt{\\langle\\left(\\bullet-\\langle\\bullet\\rangle\\right)^2\\rangle}$\n$E$ | $16390\\pm40$ | $570\\pm 30$ | $16960\\pm90$ | $520\\pm20$\n$\\tau_{\\rm i}$ | $0.658\\pm0.001$ | $0.0195\\pm0.0007$ | $0.689\\pm0.003$ | $0.0182\\pm0.0005$\n$\\tau_{\\rm o}$ | $0.658\\pm0.002$ | $0.0232\\pm0.0009$ | $0.690\\pm0.004$ | $0.0209\\pm0.0006$\n$c_{\\theta}$ | $-34.18\\pm0.08$ | $3.47\\pm0.07$ | $-35.4\\pm0.2$ | $3.2\\pm0.2$",
