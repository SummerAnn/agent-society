      "title": "Paper paragraph",
      "citation": "SciTaT item 1602.05314v1-q1",
      "summary": "\\PAR{Repeated sequences.}\nWe first evaluate a model that was trained on sequences that had been constructed by concatenating two instances of the same sequence (Fig.~\\ref{fig:lstm_repeated}). For this model, we take predictions only for the images from the second half of the sequence (\\ie the repeated part). Thus, all predictions are conditioned on observations from all images. At inference time, passing the sequence to the model for the first time can be viewed as an \\emph{encoding} stage where the LSTM builds up an internal state based on the images. The second pass is the \\emph{decoding} stage where at each image, the LSTM makes a prediction based on its state and the current image. Results show that this approach outperforms the single-pass LSTMs (Tab.~\\ref{tab:basic-lstm-results}, LSTM rep), achieving a 7.8\\% relative improvement at street level, at the cost of a twofold increase in inference time. However, by visually inspecting the results we observed a problem with this approach: if there are low-confidence images at the beginning of the sequence, they tend to get assigned to the last confident location in the sequence, because the model learns to rely on its previous prediction. Therefore, predictions from the end of the sequence get carried over to the beginning.",
      "url": "https://github.com/zhxlia/SciTaT",
