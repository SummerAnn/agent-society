      "citation": "SciTaT item 2311.08320v1-q1",
      "summary": "\\subsubsection {Task context save/restore acceleration}\nRegister banking is a technique adopted by several interrupt controller architectures to swap a task's context without pushing/popping register values to the stack at the cost of an additional area overhead in the design.\nAs discussed above, in Arm designs, this is the case of \\gls{hw} register banking in platform-level interrupt controllers (\\gls{gic}). \nA similar approach is implemented in the Renesas M32C/80 series~\\cite{renesas_m32c80}. A dual register bank allows quickly swapping the context without saving/restoring to/from the stack, as the second register bank is reserved for high-speed interrupts.\nThe Aurix family instead implements a \\gls{sw} managed solution, featuring a specific organization of the context layout in the system memory based on \\glspl{csa} chained in a linked list fashion~\\cite{tricore_patent}.\nThese approaches trade-off \\gls{hw} and \\gls{sw}-induced latencies when handling asynchronous events, as depicted in~\\cref{fig:int-latency-decomposed}. Gaitan et al.~\\cite{TASK_SWITCHING_TVLSI} propose instead a full \\gls{hw} solution based on a Hardware Scheduling Engine (HSE) that directly attaches interrupts to running tasks without the need for a specialized interrupt controller. While this approach allows lowering interrupt latency and task context switches dramatically, as reported in \\cref{tab:related_work}, it is expensive in terms of area as it requires replicating hardware resources per task.",
      "url": "https://github.com/zhxlia/SciTaT",
      "notes": []
    },
