      "summary": "\\subsection {Modeling~\\label{sec:modeling}\n}\nThe yaw and pitch axes of the robot arm were orthogonal; thus, the equations of motion for each motor can be independently established.\nThe equations of motion for each motor are as follows:\n\\begin{equation}\n\\bar{J}_{j}\\ddot{\\theta}_j(t) = \\bar{K}_ji_j(t) - \\tau_j^{d}(t), \\quad \\forall j\\in\\{1,2\\}, \\label{math:yaw} \n\\end{equation}\n\\hspace*{-1ex}\nwhere the subscript $j\\in\\{1, 2\\}$ denotes the yaw and pitch motors, respectively, \n$i_j\\in\\mathbb{R}$ is the current input to the motor, \n$\\theta_j\\in\\mathbb{R}$ is the angle measurable by the encoder, and $\\tau_j^{d}\\in\\mathbb{R}$ is the unknown disturbance torque.\n$\\bar{J}_{j}$ and $\\bar{K}_j$ are the nominal values of the moment of inertia and torque coefficient, respectively, and their values are listed in TABLE~\\ref{tab:spec}, which are obtained from the specifications. \nHereafter, subscript $j$ is omitted for simplicity.",
