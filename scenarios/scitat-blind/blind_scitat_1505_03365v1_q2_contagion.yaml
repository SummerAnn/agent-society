      "text": "Although choosing appropriate proposals is of crucial importance, little research has been conducted on generating good proposals. Previous approaches can be roughly divided into two categories: offline and online generation. Most existing approaches generate proposals offline (\\textit{type 1} in Table~\\ref{table:types}). Before the optimization begins, multiple number of hypotheses are generated by some heuristics. For example, Woodford $\\etal$~\\cite{CVPR/Woodford08} used approximated disparity maps as proposals for stereo application. Lempitsky $\\etal$~\\cite{Lempitsky/PAMI10} used the Lucas-Kanade (LK) and the Horn-Schunck (HS) methods with various parameter settings for optical flow. They do not take the objective energy function into account when generating proposals. Also, the number of proposals is limited by predetermined parameters. In addition, those proposals are application-specific and require domain knowledge.",
